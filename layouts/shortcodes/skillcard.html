<div class="skill-card {{ .Get "align" }}">
    {{ if .Get "image" }}
    <div class="card-image">
        <img src="{{ .Get "image" }}" alt="{{ .Get "title" }} icon">
    </div>
    {{ end }}
    <div class="card-content">
        <div class="skill-card-title">{{ .Get "title" }}</div>
        <div class="skill-card-content-inner">
            {{ .Inner | markdownify }}
        </div>
    </div>
</div>
